[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklab-cli"
version = "0.1.0"
description = "A small task CLI used to practise Git branches and worktrees."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
tasklab = "tasklab.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["tasklab*"]
